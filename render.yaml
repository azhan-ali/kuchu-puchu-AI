# ========================================================
# Kuchu Puchu AI — Render Blueprint Configuration
# Deploys Backend (Docker Web Service) & Frontend (Static Site)
# ========================================================

services:
  # ── 1. Backend Web Service ──────────────────────────────
  - type: web
    name: kuchu-puchu-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # Can be upgraded to standard (2GB RAM) for heavier workloads
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DOWNLOAD_DIR
        value: /tmp/downloads
      - key: CHROMA_PERSIST_DIR
        value: /tmp/vector_db
      - key: WHISPER_MODEL
        value: base # Use 'base' or 'tiny' to stay safely within Render free tier 512MB RAM
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://kuchu-puchu-ai-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://kuchu-puchu-ai-frontend.onrender.com,http://localhost:3000,http://localhost:8000

  # ── 2. Frontend Static Site ─────────────────────────────
  - type: static
    name: kuchu-puchu-ai-frontend
    buildCommand: "node ./scripts/generate-env.js"
    staticPublishPath: ./frontend
    autoDeploy: true
    envVars:
      - key: BACKEND_API_URL
        value: https://kuchu-puchu-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
