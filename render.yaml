services:
  - type: web
    name: kuchu-puchu-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard # Standard (2GB RAM) or Pro recommended for PyTorch + Whisper workloads
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: WHISPER_MODEL
        value: small
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
