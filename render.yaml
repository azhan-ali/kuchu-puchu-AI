# ========================================================
# Kuchu Puchu AI — Render Blueprint Configuration
# Deploys Backend (Docker Web Service) & Frontend (Static Site)
# ========================================================

services:
  # ── 1. Backend Web Service ──────────────────────────────
  - type: web
    name: kuchu-puchu-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # Can be upgraded to standard (2GB RAM) for heavier workloads
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: WHISPER_MODEL
        value: base # Use 'base' or 'tiny' to stay safely within Render free tier 512MB RAM
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

  # ── 2. Frontend Static Site ─────────────────────────────
  - type: static
    name: kuchu-puchu-ai-frontend
    buildCommand: "" # Pure HTML/CSS/JS requires no build step
    staticPublishPath: ./frontend
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
